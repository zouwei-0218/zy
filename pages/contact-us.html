<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我们 - 获取免费报价</title>
    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="../css/contact-us.css">
</head>
<body>

    <!-- Contact Form 区域 -->
    <section class="section-contact"  id="contact-us">
        <div class="contact-card">
            <h2>CONTACT US</h2>
            <form id="contactForm" class="contact-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label>Name <color style="color: red;">*</color></label>
                        <input type="text" name="user_name" required>
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group">
                        <label>Email <color style="color: red;">*</color></label>
                        <input type="email" name="user_email" required>
                        <div class="error-message"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" name="user_phone">
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group">
                        <label>Country</label>
                        <input type="text" name="user_country">
                        <div class="error-message"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Message <color style="color: red;">*</color></label>
                        <textarea name="message" required></textarea>
                        <div class="error-message"></div>
                    </div>
                </div>

                <button type="button" id="sendEmailBtn", onclick="send_email()">GET A FREE QUOTE</button>
            </form>
        </div>
    </section>
    <script type="text/javascript" src="../javascript/contact-us.js"></script>
    <script type="text/javascript" src="../javascript/lib/email.min.js"></script>

</body>
</html>
